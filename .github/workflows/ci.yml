name: CI/CD

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          errors=0
          while IFS= read -r file; do
            php -l "$file" 2>&1 | head -1
            if ! php -l "$file" > /dev/null 2>&1; then
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.php' -not -path './vendor/*')
          echo "---"
          if [ "$errors" -gt 0 ]; then
            echo "$errors file(s) failed syntax check"
            exit 1
          fi
          echo "All PHP files passed syntax check"

  deploy:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    needs: php-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.env' --exclude='.git' --exclude='id_rsa' --exclude='id_rsa.pub' --exclude='assets/media/' --exclude='assets/img/' --exclude='uploads/'
          path: ./
          remote_path: ~/public_html/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_KEY }}
